contract_version: "v0.1-contract"

app:
  title: "听清又听懂·智能音频急救台"
  output_root: "outputs"
  concurrency: 1

audio:
  target_sample_rate: 48000
  channels: 1
  pcm_subtype: "PCM_16"
  min_duration_seconds: 1
  max_duration_seconds: 60
  demo_max_duration_seconds: 15
  peak_limit: 0.99

enhancement:
  backend: "deepfilternet"
  model: "DeepFilterNet3"
  # Expected 4090 cache fingerprints. A's Round-2 task must verify the actual
  # files at load time before these values can be treated as an enforced pin.
  checkpoint_sha256: "23b92884f63ccf54bb026014604625ab231657b6480df65db4095c4c171e6003"
  config_sha256: "415eb925d44990d938fb739f514aa3662c1ec0ea836cff044fa1291b82cb4290"
  default_strength: 0.75
  strengths:
    light: 0.50
    standard: 0.75
    strong: 1.00
  default_playback_track: "mixed"
  default_asr_after_track: "mixed"

asr:
  backend: "openai-whisper"
  model: "base"
  # Expected fingerprint; runtime fail-closed verification is tracked in A #3.
  checkpoint_sha256: "ed3a0b6b1c0edf879ad9b11b1af5a0e6ab5db9205f891f668f8b0e6c6326e34e"
  language: "zh"
  task: "transcribe"
  device: "auto"
  temperature: 0.0
  condition_on_previous_text: false
  initial_prompt: null
  fp16_on_cuda: true

comparison:
  loudness_dsp_matching: false
  same_player_volume: true
  report_rms_dbfs: true
  report_peak_abs: true

events:
  enabled_by_default: false

cache:
  enabled: true
  demo_only: true
